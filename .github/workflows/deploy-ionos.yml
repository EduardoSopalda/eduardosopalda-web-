name: Deploy to IONOS

# The build itself is now fully static (the Vercel adapter and both
# /api routes are gone -- see astro.config.mjs), so this workflow is no
# longer blocked on a hosting-architecture mismatch. The remaining
# blocker was the deploy step itself: wlixcc/SFTP-Deploy-Action issues
# a raw SSH shell command ("mkdir -p") before uploading, and this IONOS
# account's shell is restricted to the sftp subsystem only (rssh) --
# confirmed via a failed test run (run #1) that got "This account is
# restricted by rssh. Allowed commands: sftp" before it ever reached
# remote_path. Replaced with a small script using ssh2-sftp-client,
# which never shells out -- see .github/scripts/deploy-ionos.mjs.
# workflow_dispatch lets this run manually; re-add
# "push: branches: [main]" once a manual run is verified working, to
# get real push-to-deploy.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro build

      # IONOS Hosting Plus has no Git integration, so this is the
      # replacement for what a Vercel/Deploy Now push-to-deploy would
      # have done -- upload the static build over SFTP instead.
      #
      # This webspace hosts more than one site as sibling subfolders
      # (e.g. /alinaweb next to /eduardoweb), and the domain can't be
      # attached to the webspace root -- only to a subfolder. /eduardoweb
      # is that subfolder for eduardosopalda.com. It previously held an
      # unrelated site (confirmed stale); clear it out via the IONOS
      # file manager before this workflow's first real run, since the
      # upload adds to whatever is already there rather than replacing
      # the folder wholesale.
      - name: Deploy to IONOS via SFTP
        run: |
          npm install --no-save ssh2-sftp-client
          node .github/scripts/deploy-ionos.mjs
        env:
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
