name: Deploy to IONOS

# The build itself is now fully static (the Vercel adapter and both
# /api routes are gone -- see astro.config.mjs), so this workflow is no
# longer blocked on a hosting-architecture mismatch. remote_path below
# is now confirmed against this IONOS webspace's real folder structure
# (/eduardoweb, shared with other unrelated sites like /alinaweb --
# IONOS would not let the domain attach to the webspace root).
# IONOS_SFTP_PASSWORD still needs to be added as a repository secret
# before this can run at all. workflow_dispatch lets it run manually
# once that's set; re-add "push: branches: [main]" here once a manual
# run has been verified, to get real push-to-deploy.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro build

      # IONOS Hosting Plus has no Git integration, so this is the
      # replacement for what a Vercel/Deploy Now push-to-deploy would
      # have done -- upload the static build over SFTP instead.
      #
      # This webspace hosts more than one site as sibling subfolders
      # (e.g. /alinaweb next to /eduardoweb), and the domain can't be
      # attached to the webspace root -- only to a subfolder. /eduardoweb
      # is that subfolder for eduardosopalda.com. It previously held an
      # unrelated site (confirmed stale); clear it out via the IONOS
      # file manager before this workflow's first real run, since this
      # action uploads on top of whatever is already there rather than
      # replacing the folder wholesale.
      - name: Deploy to IONOS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: a604739
          server: access-5017995636.webspace-host.com
          port: 22
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: '/eduardoweb'
